name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hirmand_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hirmand_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/typecheck.log
          exit "$code"

      - name: Report typecheck errors to PR
        if: steps.typecheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const output = fs.existsSync("/tmp/typecheck.log")
              ? fs.readFileSync("/tmp/typecheck.log", "utf8")
              : "No compiler output was captured.";
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${context.ref.replace("refs/heads/", "")}`,
              per_page: 10,
            });
            const pr = pulls.data[0];
            if (!pr) {
              core.warning("No open PR found for the current branch.");
              return;
            }
            const trimmed = output.length > 14000 ? output.slice(-14000) : output;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `### TypeScript compiler output\\n\\n\`\`\`text\\n${trimmed}\\n\`\`\``,
            });

      - name: Fail typecheck
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_SITE_URL: https://www.hirmandrealestate.ir
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hirmand_ci
