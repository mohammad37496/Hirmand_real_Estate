name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: hirmand-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify npm lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run npm install locally and commit the updated lockfile."
            git diff -- package-lock.json
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Browser smoke against production preview
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace
          sudo chown "$USER":"$USER" /workspace

          npx vite preview --host 127.0.0.1 --port 8081 > /tmp/hirmand-preview.log 2>&1 &
          PREVIEW_PID=$!

          cleanup() {
            status=$?
            kill "$PREVIEW_PID" >/dev/null 2>&1 || true
            wait "$PREVIEW_PID" >/dev/null 2>&1 || true
            if [ "$status" -ne 0 ]; then
              echo "::group::Vite preview log"
              cat /tmp/hirmand-preview.log || true
              echo "::endgroup::"
            fi
            exit "$status"
          }
          trap cleanup EXIT

          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            if ! kill -0 "$PREVIEW_PID" >/dev/null 2>&1; then
              echo "::error::Vite preview exited before becoming ready."
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "::error::Vite preview did not become ready on port 8081."
              exit 1
            fi
            sleep 1
          done

          npx playwright install --with-deps chromium
          curl --silent --fail http://127.0.0.1:8081/ >/dev/null
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/hirmand-preview.png

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hirmand-browser-smoke
          path: /workspace/screenshots
          if-no-files-found: warn
