name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: hirmand-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify npm lockfile
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run npm install locally and commit the updated lockfile."
            git diff -- package-lock.json
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Browser smoke against production preview
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /workspace
          sudo chown "$USER":"$USER" /workspace

          npm run preview:restart
          trap 'npm run preview:stop >/dev/null 2>&1 || true' EXIT

          npx playwright install --with-deps chromium
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ /workspace/screenshots/hirmand-preview.png

      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hirmand-browser-smoke
          path: /workspace/screenshots
          if-no-files-found: warn
