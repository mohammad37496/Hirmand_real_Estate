name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hirmand-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: production deploy
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Live Vercel project identifiers (not credentials).
      VERCEL_ORG_ID: team_FPapzgJx90YRyaonBmXy9lhS
      VERCEL_PROJECT_ID: prj_ZgZjE26DjWCLeqiRfMkDSkB90Fzh
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel access
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_PROJECT_ID must be configured."
            exit 1
          fi

          echo "Checking which Vercel account owns this token..."
          npx vercel whoami --token "${VERCEL_TOKEN}"

          echo "Checking projects visible to this token..."
          npx vercel project ls --token "${VERCEL_TOKEN}"

      - name: Deploy with Vercel CLI
        shell: bash
        run: |
          set -euo pipefail

          npx vercel pull --yes \
            --environment=production \
            --token "${VERCEL_TOKEN}"

          npx vercel build --prod --token "${VERCEL_TOKEN}"

          npx vercel deploy --prebuilt --prod --token "${VERCEL_TOKEN}"
