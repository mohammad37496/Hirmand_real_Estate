name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hirmand-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: production deploy
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Vercel deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN is not configured."
            exit 1
          fi

          if [ -z "${VERCEL_SCOPE:-}" ]; then
            echo "::error::VERCEL_SCOPE (or VERCEL_ORG_ID) is not configured."
            exit 1
          fi

          if [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::VERCEL_PROJECT_ID is not configured."
            exit 1
          fi

      - name: Link and deploy production
        shell: bash
        run: |
          set -euo pipefail

          VERCEL="npx --yes vercel@59.23.2"

          ${VERCEL} link --yes             --project "${VERCEL_PROJECT_ID}"             --scope "${VERCEL_SCOPE}"             --token "${VERCEL_TOKEN}"

          ${VERCEL} pull --yes             --environment=production             --scope "${VERCEL_SCOPE}"             --token "${VERCEL_TOKEN}"

          ${VERCEL} build --prod             --scope "${VERCEL_SCOPE}"             --token "${VERCEL_TOKEN}"

          ${VERCEL} deploy --prebuilt --prod             --scope "${VERCEL_SCOPE}"             --token "${VERCEL_TOKEN}"
