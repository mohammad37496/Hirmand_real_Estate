name: Deploy to Liara

on:
  push:
    branches:
      - main

# Only the newest main commit should be deployed. A per-SHA group allowed
# several Liara deployments to run at the same time and could leave the app
# serving an older deployment.
concurrency:
  group: liara-deploy-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The upload, build and release finish in about five minutes.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Liara CLI
        run: npm i -g @liara/cli@9

      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          http_proxy: http://proxy.liara.ir:6666
          https_proxy: http://proxy.liara.ir:6666
        # `--no-app-logs` is required, not cosmetic. Without it the CLI keeps
        # streaming the app's log stream after printing "Deployment finished
        # successfully", never exits, and the job burns the rest of its budget
        # until the timeout cancels it — so a deploy that worked showed up as a
        # cancelled run. That is why every run in this workflow's history reads
        # as cancelled.
        run: >-
          liara deploy
          --app="hirmand"
          --api-token="$LIARA_TOKEN"
          --build-location="germany"
          --no-app-logs
          --message="Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          --debug
