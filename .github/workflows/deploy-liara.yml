name: Deploy to Liara

on:
  push:
    branches:
      - main

# Only the newest main commit should be deployed. A per-SHA group allowed
# several Liara deployments to run at the same time and could leave the app
# serving an older deployment.
concurrency:
  group: liara-deploy-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare self-hosted fallback assets
        run: |
          refresh=0
          if [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA")"
            if printf '%s\n' "$changed" | grep -Eq '^(scripts/fallback-source-images.json|scripts/generate-fallback-assets.mjs)$'; then
              refresh=1
            fi
          fi
          echo "Fallback image refresh: $refresh"
          FORCE_FALLBACK_IMAGE_REFRESH="$refresh" node scripts/generate-fallback-assets.mjs

      - name: Remove legacy SVG fallback assets
        run: find public/images/fallback -type f -name "*.svg" -delete

      - name: Commit fallback assets
        run: |
          if git diff --quiet -- public/images/fallback; then
            echo "No fallback asset changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/fallback
          git commit -m "build: vendor self-hosted fallback images [skip ci]"
          git push origin HEAD:main

      - name: Install Liara CLI
        run: npm i -g @liara/cli@9

      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          http_proxy: http://proxy.liara.ir:6666
          https_proxy: http://proxy.liara.ir:6666
        run: liara deploy --app="hirmand" --api-token="$LIARA_TOKEN" --build-location="germany" --debug
