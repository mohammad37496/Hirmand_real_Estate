name: Deploy to Liara
# Deployment trigger: keep Liara in sync with the latest main commit.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the newest main commit should be deployed.
concurrency:
  group: liara-deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Liara CLI
        run: npm i -g @liara/cli@9

      # A 404 "Could not find the app" means the token cannot see that app ID,
      # or the app belongs to a team that was not selected. List visible apps
      # before deployment to make the account/team scope diagnosable.
      - name: Verify Liara credentials and list visible apps
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LIARA_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret LIARA_API_TOKEN is empty or unavailable."
            exit 1
          fi

          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
            echo "Checking apps in the configured Liara team."
          else
            echo "Checking apps in the Liara account associated with LIARA_API_TOKEN."
            echo "If hirmand belongs to a team, add a GitHub Actions secret named LIARA_TEAM_ID."
          fi

          liara app list --api-token="${LIARA_TOKEN}" "${TEAM_ARGS[@]}" --output json

      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
          http_proxy: http://proxy.liara.ir:6666
          https_proxy: http://proxy.liara.ir:6666
        shell: bash
        run: |
          set -euo pipefail
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi

          liara deploy \
            --app="hirmand" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --build-location="germany" \
            --port="3000" \
            --no-app-logs \
            --message="Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --debug

      - name: Diagnose Liara runtime on failure
        if: failure()
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          LIARA_TEAM_ID: ${{ secrets.LIARA_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          TEAM_ARGS=()
          if [[ -n "${LIARA_TEAM_ID:-}" ]]; then
            TEAM_ARGS+=(--team-id="${LIARA_TEAM_ID}")
          fi
          liara app logs \
            --app="hirmand" \
            --api-token="${LIARA_TOKEN}" \
            "${TEAM_ARGS[@]}" \
            --timestamps \
            --last-lines \
            --since="30 minutes ago"
