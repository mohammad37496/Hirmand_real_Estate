name: Deploy to Liara

on:
  push:
    branches:
      - main

# Only the newest main commit should be deployed. A per-SHA group allowed
# several Liara deployments to run at the same time and could leave the app
# serving an older deployment.
concurrency:
  group: liara-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Liara CLI
        run: npm i -g @liara/cli@9

      - name: Deploy
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
          http_proxy: http://proxy.liara.ir:6666
          https_proxy: http://proxy.liara.ir:6666
        run: liara deploy --app="hirmand" --api-token="$LIARA_TOKEN" --build-location="germany" --no-cache --debug
