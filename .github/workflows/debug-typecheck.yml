name: Debug Typecheck

on:
  push:
    branches: ["feat/property-discovery-tools"]

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run typecheck and capture output
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          echo "TYPECHECK_EXIT=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Report compiler output to PR
        if: failure() && steps.typecheck.outputs.TYPECHECK_EXIT != ''
        uses: actions/github-script@v7
        env:
          TYPECHECK_EXIT: ${{ steps.typecheck.outputs.TYPECHECK_EXIT }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const body = fs.existsSync("/tmp/typecheck.log")
              ? fs.readFileSync("/tmp/typecheck.log", "utf8")
              : "No typecheck output was captured.";
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${context.ref.replace("refs/heads/", "")}`,
              per_page: 10,
            });
            const pr = pulls.data[0];
            if (!pr) {
              core.warning("No open PR found for the debug branch.");
              return;
            }
            const trimmed = body.length > 12000 ? body.slice(-12000) : body;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `### Typecheck debug (exit ${process.env.TYPECHECK_EXIT})\\n\\n\`\`\`text\\n${trimmed}\\n\`\`\``,
            });
