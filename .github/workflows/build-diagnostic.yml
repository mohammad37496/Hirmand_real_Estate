name: Build diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/hirmand-build.log
        env:
          NODE_ENV: production

      - name: Report failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          text = Path('/tmp/hirmand-build.log').read_text(errors='replace')[-12000:]
          sha = os.environ['GITHUB_SHA_VALUE']
          Path('/tmp/issue-body.md').write_text(
              'Build failed for commit `' + sha + '`.\n\n' +
              'Last build output:\n\n```text\n' + text + '\n```\n',
              encoding='utf-8',
          )
          PY
          gh issue create \
            --title "Build failure: $GITHUB_SHA_VALUE" \
            --body-file /tmp/issue-body.md

      - name: Fail job after reporting
        if: steps.build.outcome == 'failure'
        run: exit 1
